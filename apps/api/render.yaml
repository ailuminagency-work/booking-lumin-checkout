# Render blueprint for the hostable @lumin/api service.
#
# OWNER STEP: creating the Render service and setting the secret VALUES below is
# a manual owner action in the Render dashboard (or `render blueprint launch`).
# This file declares only the secret NAMES (sync:false). It contains NO secret
# values and none must ever be committed here.
#
# The production entrypoint is src/main.ts (real Supabase-JWT auth). The `dev`
# local harness (src/local.ts, synthetic identities) is NEVER used in production.
services:
  - type: web
    name: lumin-api
    runtime: node
    plan: starter
    rootDir: apps/api
    # Install the whole workspace so @lumin/* path deps resolve, then build (no-op).
    buildCommand: npm ci --prefix ../.. && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      # ---- Secrets: NAMES ONLY. Set values in the Render dashboard. ----
      - key: DATABASE_URL # Postgres connection string (role may `set role service_role`)
        sync: false
      - key: SUPABASE_URL # https://<project-ref>.supabase.co
        sync: false
      - key: SUPABASE_ANON_KEY # Supabase anon/publishable key; used as the /auth/v1/user apikey
        sync: false
      # ---- Non-secret required config (CORS origin allowlists) ----
      - key: OWNER_ORIGINS # comma-separated owner-console origins (command-center / portal)
        sync: false
      - key: CUSTOMER_ORIGINS # comma-separated hosted-checkout origins
        sync: false
      # ---- Environment identity --------------------------------------------
      # Declared explicitly so the service reports itself truthfully and so the
      # fake-payment gate has an unambiguous value to refuse against.
      #
      # This is a hard value, NOT sync:false, on purpose. The dangerous direction
      # is a production service labelled 'staging', which would unlock simulated
      # money on real traffic; pinning 'production' in code review makes that
      # impossible to do by a dashboard edit alone.
      #
      # THE STAGING SERVICE OVERRIDES THIS IN THE RENDER DASHBOARD
      # (BOOKING_LUMIN_ENV=staging) and that override must survive. Since
      # migration 0088 the variable also decides AVAILABILITY, not just which
      # capabilities compose: simulated-payment-readiness.ts refuses to start, and
      # refuses every request including /health, when this is not 'staging' while
      # the attached database would confirm a simulated provider. A staging
      # database carries exactly that declaration as its documented bootstrap row,
      # so syncing this blueprint onto the STAGING service relabels it
      # 'production' and takes the staging API hard down until the dashboard value
      # is restored. The log line names this variable so the cause is unambiguous.
      - key: BOOKING_LUMIN_ENV
        value: production
      # ---- Simulated money: must stay OFF outside staging -------------------
      # mockPaymentsEnabled() THROWS if this is '1' while BOOKING_LUMIN_ENV is
      # not 'staging', so the service refuses to start rather than taking fake
      # money. Pinned to '0' here; never set it to '1' in a production service.
      - key: BOOKING_LUMIN_FAKE_PAYMENTS
        value: "0"
      # ---- Product capabilities: production-legal, DEFAULT-CLOSED -----------
      # Each is enabled only by the exact string '1'. Absent means off, so a
      # production deploy opts in to one capability at a time. None of these can
      # enable simulated payments -- that is the gate above, and only there.
      - key: BOOKING_LUMIN_BUSINESS_ONBOARDING
        sync: false
      - key: BOOKING_LUMIN_CATALOG_AUTHORING
        sync: false
      - key: BOOKING_LUMIN_SCHEDULING_AUTHORING
        sync: false
      - key: BOOKING_LUMIN_DETAILING_PUBLICATION
        sync: false
      # Publishing / reading publications, install health, version history and
      # rollback. Previously trapped behind the fake-payment gate (gap G1).
      - key: BOOKING_LUMIN_PAID_PUBLICATION
        sync: false
      # Owner booking operations: list, detail (answers + activity trail) and owner
      # cancellation. Previously gated on BOOKING_LUMIN_ENV==='staging' with no flag,
      # so the owner half of the booking loop could not run in production at all.
      # Cancellation here is NOT a refund: it never touches payments or refunds, and a
      # cancelled booking may remain paid.
      - key: BOOKING_LUMIN_OWNER_BOOKING_OPS
        sync: false
      # Payment connection visibility (P1 step 3): the READ-ONLY view of which
      # provider account a tenant is connected to and whether it can actually take
      # money. Migration 0093 recorded those facts and nothing could show them, so
      # an owner whose payments had gone degraded or blocked had no way to find out.
      # Reading only: this opens no path to begin a handoff, bind an account or
      # record an observation, and it exposes no credential -- under the Connect
      # design a connection is an account REFERENCE, useless without the platform
      # secret that never leaves the server runtime.
      - key: BOOKING_LUMIN_PAYMENT_CONNECTION_VISIBILITY
        sync: false
      # Payment connection WRITE path (P1 step 5): begin a provider handoff and
      # record the verified connection it produces. Separate from the read flag
      # because reading which account a tenant is connected to and CHANGING it are
      # different authorities -- a deployment can show the state without being able
      # to alter it. This moves no money: it decides which connected account a
      # later charge would be created on, and routing that charge is a further step
      # behind a further flag.
      - key: BOOKING_LUMIN_PAYMENT_CONNECTION_WRITE
        sync: false
      - key: BOOKING_LUMIN_JOURNEY_AUTHORING
        sync: false
      - key: BOOKING_LUMIN_JOURNEY_PUBLICATION
        sync: false
      - key: BOOKING_LUMIN_JOURNEY_SESSIONS
        sync: false
      - key: BOOKING_LUMIN_NOTIFICATION_AUTHORING
        sync: false
