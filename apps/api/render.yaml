# Render blueprint for the hostable @lumin/api service.
#
# OWNER STEP: creating the Render service and setting the secret VALUES below is
# a manual owner action in the Render dashboard (or `render blueprint launch`).
# This file declares only the secret NAMES (sync:false). It contains NO secret
# values and none must ever be committed here.
#
# The production entrypoint is src/main.ts (real Supabase-JWT auth). The `dev`
# local harness (src/local.ts, synthetic identities) is NEVER used in production.
services:
  - type: web
    name: lumin-api
    runtime: node
    plan: starter
    rootDir: apps/api
    # Install the whole workspace so @lumin/* path deps resolve, then build (no-op).
    buildCommand: npm ci --prefix ../.. && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      # ---- Secrets: NAMES ONLY. Set values in the Render dashboard. ----
      - key: DATABASE_URL # Postgres connection string (role may `set role service_role`)
        sync: false
      - key: SUPABASE_URL # https://<project-ref>.supabase.co
        sync: false
      - key: SUPABASE_ANON_KEY # Supabase anon/publishable key; used as the /auth/v1/user apikey
        sync: false
      # ---- Non-secret required config (CORS origin allowlists) ----
      - key: OWNER_ORIGINS # comma-separated owner-console origins (command-center / portal)
        sync: false
      - key: CUSTOMER_ORIGINS # comma-separated hosted-checkout origins
        sync: false
      # ---- Environment identity --------------------------------------------
      # Declared explicitly so the service reports itself truthfully and so the
      # fake-payment gate has an unambiguous value to refuse against.
      - key: BOOKING_LUMIN_ENV
        value: production
      # ---- Simulated money: must stay OFF outside staging -------------------
      # mockPaymentsEnabled() THROWS if this is '1' while BOOKING_LUMIN_ENV is
      # not 'staging', so the service refuses to start rather than taking fake
      # money. Pinned to '0' here; never set it to '1' in a production service.
      - key: BOOKING_LUMIN_FAKE_PAYMENTS
        value: "0"
      # ---- Product capabilities: production-legal, DEFAULT-CLOSED -----------
      # Each is enabled only by the exact string '1'. Absent means off, so a
      # production deploy opts in to one capability at a time. None of these can
      # enable simulated payments -- that is the gate above, and only there.
      - key: BOOKING_LUMIN_BUSINESS_ONBOARDING
        sync: false
      - key: BOOKING_LUMIN_CATALOG_AUTHORING
        sync: false
      - key: BOOKING_LUMIN_SCHEDULING_AUTHORING
        sync: false
      - key: BOOKING_LUMIN_DETAILING_PUBLICATION
        sync: false
      # Publishing / reading publications, install health, version history and
      # rollback. Previously trapped behind the fake-payment gate (gap G1).
      - key: BOOKING_LUMIN_PAID_PUBLICATION
        sync: false
      - key: BOOKING_LUMIN_JOURNEY_AUTHORING
        sync: false
      - key: BOOKING_LUMIN_JOURNEY_PUBLICATION
        sync: false
      - key: BOOKING_LUMIN_JOURNEY_SESSIONS
        sync: false
      - key: BOOKING_LUMIN_NOTIFICATION_AUTHORING
        sync: false
