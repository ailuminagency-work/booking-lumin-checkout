          done
          npx tsx apps/api/src/customer-payment.integration.ts
      - name: Paid simple publication HTTP journey and expiry rollback
        env:
          PAID_SIMPLE_LOCAL_TEST: '1'
          PGDATABASE: lumin_phase_a_paid_ci
        run: |
          psql -d postgres -c 'create database lumin_phase_a_paid_ci;'
