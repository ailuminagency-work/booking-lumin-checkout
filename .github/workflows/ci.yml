name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: verify (typecheck, test, build, contamination)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Record runtime versions
        run: node --version && npm --version
      - run: npm ci
      - name: Check dependency security advisories
        run: npm audit --audit-level=moderate
      - name: Validate execution workflow and gate ledger
        run: node --test scripts/program-status.test.mjs && node scripts/program-status.mjs
      - run: node --test scripts/run-mode-owner-browser.test.mjs scripts/mode-owner-artifacts.test.mjs scripts/preview-mode.test.mjs
      - name: Verify document TLS, runner and artifact boundaries
        run: node --test scripts/mode-document-tls.test.mjs scripts/mode-document-artifacts.test.mjs scripts/run-mode-document-browser.test.mjs scripts/collect-mode-document-artifacts.test.mjs
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run build:preview
      - run: bash scripts/contamination-check.test.sh && bash scripts/contamination-check.sh

  database:
    name: database (migrations + RLS attack suite)
    timeout-minutes: 25
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: lumin_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create test database
        run: psql -h localhost -U postgres -d postgres -c 'create database lumin_test;'
      - name: Apply local harness
        run: psql -v ON_ERROR_STOP=1 -d lumin_test -f supabase/tests/local_harness.sql
      - name: Apply all active migrations in order (excluding _deferred)
        run: |
          for f in supabase/migrations/0*.sql; do
            echo "applying $f"
            psql -v ON_ERROR_STOP=1 -d lumin_test -f "$f"
          done
      - name: Run RLS attack suite (fails on any FAIL)
        run: psql -v ON_ERROR_STOP=1 -d lumin_test -f supabase/tests/rls_attack_tests.sql
      - name: Verify platform financial minimization and suspended tenant denial
        run: psql -v ON_ERROR_STOP=1 -d lumin_test -f supabase/tests/platform_financial_minimization_tests.sql
      - name: Run capacity hold invariants
        run: psql -v ON_ERROR_STOP=1 -d lumin_test -f supabase/tests/capacity_tests.sql
      - name: Run resource tenant-isolation attacks
        run: psql -v ON_ERROR_STOP=1 -d lumin_test -f supabase/tests/resource_rls_tests.sql
      - name: Reject cross-tenant resource relationships
        run: psql -v ON_ERROR_STOP=1 -d lumin_test -f supabase/tests/resource_tenant_integrity_tests.sql
      - name: Verify shared resource unit accounting and legacy compatibility
        run: psql -v ON_ERROR_STOP=1 -d lumin_test -f supabase/tests/resource_quantity_tests.sql
      - name: Verify isolated worker roster and owner mutation boundaries
        run: psql -v ON_ERROR_STOP=1 -d lumin_test -f supabase/tests/worker_roster_tests.sql
      - name: Verify complete bounded owner roster snapshot
        run: psql -v ON_ERROR_STOP=1 -d lumin_test -f supabase/tests/owner_roster_snapshot_tests.sql
      - name: Verify explicit planning policy and legacy booking boundary
        run: psql -v ON_ERROR_STOP=1 -d lumin_test -f supabase/tests/planning_policy_tests.sql
      - name: Verify direct carrier writes are denied and legacy RPCs remain usable
        run: psql -v ON_ERROR_STOP=1 -d lumin_test -f supabase/tests/carrier_direct_write_tests.sql
      - name: Verify sealed planning groups and atomic release boundaries
        run: psql -v ON_ERROR_STOP=1 -d lumin_test -f supabase/tests/group_lifecycle_tests.sql
      - name: Verify managed planning financial exclusion
        run: psql -v ON_ERROR_STOP=1 -d lumin_test -f supabase/tests/group_financial_boundary_tests.sql
      - name: Verify combined planning allocator and retained generations
        run: psql -v ON_ERROR_STOP=1 -d lumin_test -f supabase/tests/planning_allocator_tests.sql
      - name: Verify financial boundary migration preflight and rollback
        timeout-minutes: 4
        env:
          PGDATABASE: lumin_financial_preflight
          GROUP_FINANCIAL_TEST_DISPOSABLE: "1"
          GROUP_FINANCIAL_MIGRATION_FILE: supabase/migrations/0027_group_financial_boundary.sql
          GROUP_FINANCIAL_TEST_FILE: supabase/tests/group_financial_boundary_tests.sql
          GROUP_FINANCIAL_FIXTURE_FILE: supabase/tests/group_lifecycle_fixture.sql
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c 'create database lumin_financial_preflight;'
          psql -v ON_ERROR_STOP=1 -f supabase/tests/local_harness.sql
          for f in supabase/migrations/0*.sql; do
            if [ "$f" = supabase/migrations/0027_group_financial_boundary.sql ]; then break; fi
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
          python3 supabase/tests/group_financial_boundary_preflight.py
      - name: Verify cryptographic binding in the default extension layout
        run: psql -v ON_ERROR_STOP=1 -d lumin_test -f supabase/tests/crypto_extension_binding_tests.sql
      - name: Verify cryptographic preflight and atomic rollback in both layouts
        timeout-minutes: 4
        env:
          CRYPTO_BINDING_TEST_DISPOSABLE: "1"
          CRYPTO_BINDING_MIGRATION_FILE: supabase/migrations/0026_crypto_extension_binding.sql
          CRYPTO_BINDING_TEST_FILE: supabase/tests/crypto_extension_binding_tests.sql
        run: |
          for layout in public extensions; do
            export PGDATABASE="lumin_crypto_preflight_${layout}"
            psql -v ON_ERROR_STOP=1 -d postgres -c "create database $PGDATABASE;"
            if [ "$layout" = extensions ]; then
              psql -v ON_ERROR_STOP=1 -c 'create schema extensions; create extension pgcrypto with schema extensions;'
            else
              psql -v ON_ERROR_STOP=1 -c 'create extension pgcrypto with schema public;'
            fi
            psql -v ON_ERROR_STOP=1 -f supabase/tests/local_harness.sql
            for f in supabase/migrations/0*.sql; do
              if [ "$f" = supabase/migrations/0026_crypto_extension_binding.sql ]; then break; fi
              psql -v ON_ERROR_STOP=1 -f "$f"
            done
            python3 supabase/tests/crypto_extension_binding_preflight.py
          done
      - name: Verify Supabase extension layout and allocation races
        timeout-minutes: 4
        env:
          PGDATABASE: lumin_crypto_extensions
          RESOURCE_QUANTITY_TEST_DISPOSABLE: "1"
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c 'create database lumin_crypto_extensions;'
          psql -v ON_ERROR_STOP=1 -c 'create schema extensions; create extension pgcrypto with schema extensions;'
          psql -v ON_ERROR_STOP=1 -f supabase/tests/local_harness.sql
          for f in supabase/migrations/0*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -v ON_ERROR_STOP=1 -f supabase/tests/crypto_extension_binding_tests.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/capacity_tests.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/resource_quantity_tests.sql
          python3 supabase/tests/resource_quantity_concurrency.py
          bash supabase/tests/capacity_concurrency_harness.sh
      - name: Verify carrier privilege migration preflight and atomic rollback
        timeout-minutes: 2
        env:
          CARRIER_TEST_DISPOSABLE: "1"
        run: python3 supabase/tests/carrier_privilege_preflight.py
      - name: Verify durable outbox authorization and lease fencing
        run: psql -v ON_ERROR_STOP=1 -d lumin_test -f supabase/tests/outbox_tests.sql
      - name: Verify flow storage tenant isolation and revision control
        run: psql -v ON_ERROR_STOP=1 -d lumin_test -f supabase/tests/flow_storage_tests.sql
      - name: Verify bound publication and atomic customer requests
        run: psql -v ON_ERROR_STOP=1 -d lumin_test -f supabase/tests/bound_flow_tests.sql
      - name: Verify configurable publication, pinned answers and legacy guards
        run: psql -v ON_ERROR_STOP=1 -d lumin_test -f supabase/tests/configurable_flow_tests.sql
      - name: Verify configurable JavaScript and SQL fixture parity
        run: python3 supabase/tests/configurable_flow_parity.py
      # SQL suites roll back their fixtures. The final-slot harness requires
      # committed fixtures and separate concurrent transactions; run races last.
      - name: Run concurrent final-slot capacity race
        timeout-minutes: 2
        run: bash supabase/tests/capacity_concurrency_harness.sh
      - name: Run overlapping interval and timezone races
        timeout-minutes: 2
        run: bash supabase/tests/capacity_overlap_concurrency_harness.sh
      - name: Run observed resource quantity and lock-wait expiry races
        timeout-minutes: 2
        env:
          RESOURCE_QUANTITY_TEST_DISPOSABLE: "1"
        run: python3 supabase/tests/resource_quantity_concurrency.py
      - name: Run observed worker roster version contention
        timeout-minutes: 2
        env:
          WORKER_ROSTER_TEST_DISPOSABLE: "1"
        run: python3 supabase/tests/worker_roster_concurrency.py
      - name: Run observed owner snapshot and roster mutation races
        timeout-minutes: 2
        env:
          ROSTER_SNAPSHOT_TEST_DISPOSABLE: "1"
        run: python3 supabase/tests/owner_roster_snapshot_concurrency.py
      - name: Run observed policy activation and legacy writer races
        timeout-minutes: 2
        env:
          PLANNING_POLICY_TEST_DISPOSABLE: "1"
        run: python3 supabase/tests/planning_policy_concurrency.py
      - name: Run concurrent durable outbox deduplication and leases
        timeout-minutes: 2
        env:
          OUTBOX_TEST_DISPOSABLE: "1"
        run: bash supabase/tests/outbox_concurrency_harness.sh
      - name: Run concurrent flow draft revision updates
        timeout-minutes: 2
        run: python3 supabase/tests/flow_storage_concurrency.py
      - name: Run simultaneous customer request retries
        timeout-minutes: 2
        env:
          BOUND_FLOW_TEST_DISPOSABLE: "1"
        run: python3 supabase/tests/bound_flow_concurrency.py
      - name: Run configurable adoption, publication and canonical retry races
        timeout-minutes: 2
        env:
          CONFIGURABLE_FLOW_TEST_DISPOSABLE: "1"
        run: python3 supabase/tests/configurable_flow_concurrency.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Record runtime versions
        run: node --version && npm --version
      - run: npm ci
      - name: Verify persisted request journey over HTTP
        timeout-minutes: 3
        env:
          LOCAL_HARNESS: "1"
          FLOW_TEST_DISPOSABLE: "1"
        run: npm run test:flow-http --workspace @lumin/action-api
      - name: Verify owner roster operations over HTTP with PostgreSQL
        timeout-minutes: 3
        env:
          LOCAL_HARNESS: "1"
          FLOW_TEST_DISPOSABLE: "1"
        run: npm run test:roster-http --workspace @lumin/action-api
      - name: Create isolated database for retained planning group race fixtures
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c 'create database lumin_group_races;'
          psql -v ON_ERROR_STOP=1 -d lumin_group_races -f supabase/tests/local_harness.sql
          for f in supabase/migrations/0*.sql; do
            psql -v ON_ERROR_STOP=1 -d lumin_group_races -f "$f"
          done
      - name: Verify observed planning group lifecycle races
        timeout-minutes: 4
        env:
          PGDATABASE: lumin_group_races
          GROUP_LIFECYCLE_TEST_DISPOSABLE: "1"
        run: python3 supabase/tests/group_lifecycle_concurrency.py
      - name: Verify financial exclusion races in the extensions layout
        timeout-minutes: 4
        env:
          PGDATABASE: lumin_group_financial_races
          GROUP_FINANCIAL_TEST_DISPOSABLE: "1"
          GROUP_FINANCIAL_FIXTURE_FILE: supabase/tests/group_lifecycle_fixture.sql
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c 'create database lumin_group_financial_races;'
          psql -v ON_ERROR_STOP=1 -c 'create schema extensions; create extension pgcrypto with schema extensions;'
          psql -v ON_ERROR_STOP=1 -f supabase/tests/local_harness.sql
          for f in supabase/migrations/0*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -v ON_ERROR_STOP=1 -f supabase/tests/group_financial_boundary_tests.sql
          python3 supabase/tests/group_financial_boundary_concurrency.py
      - name: Verify actual allocator races and attacks in both crypto layouts
        timeout-minutes: 8
        env:
          ALLOCATOR_TEST_DISPOSABLE: "1"
          ALLOCATOR_PARENT_FIXTURE_FILE: supabase/tests/group_lifecycle_fixture.sql
        run: |
          for layout in public extensions; do
            export PGDATABASE="lumin_allocator_attack_${layout}"
            psql -v ON_ERROR_STOP=1 -d postgres -c "create database ${PGDATABASE};"
            if [ "$layout" = extensions ]; then
              psql -v ON_ERROR_STOP=1 -c 'create schema extensions; create extension pgcrypto with schema extensions;'
            else
              psql -v ON_ERROR_STOP=1 -c 'create extension pgcrypto with schema public;'
            fi
            psql -v ON_ERROR_STOP=1 -f supabase/tests/local_harness.sql
            for f in supabase/migrations/0*.sql; do
              psql -v ON_ERROR_STOP=1 -f "$f"
            done
            psql -v ON_ERROR_STOP=1 -f supabase/tests/planning_allocator_tests.sql
            python3 supabase/tests/planning_allocator_concurrency.py
            python3 supabase/tests/planning_allocator_authority.py
            python3 supabase/tests/planning_allocator_adversarial.py
          done
      - name: Verify dedicated planning transport with actual PostgreSQL in both crypto layouts
        timeout-minutes: 8
        env:
          LOCAL_HARNESS: "1"
          FLOW_TEST_DISPOSABLE: "1"
          ALLOCATOR_TRANSPORT_TEST_DISPOSABLE: "1"
        run: |
          for layout in public extensions; do
            export PGDATABASE="lumin_allocator_transport_${layout}"
            export ALLOCATOR_TRANSPORT_CRYPTO_LAYOUT="$layout"
            psql -v ON_ERROR_STOP=1 -d postgres -c "create database ${PGDATABASE};"
            if [ "$layout" = extensions ]; then
              psql -v ON_ERROR_STOP=1 -c 'create schema extensions; create extension pgcrypto with schema extensions;'
            else
              psql -v ON_ERROR_STOP=1 -c 'create extension pgcrypto with schema public;'
            fi
            psql -v ON_ERROR_STOP=1 -f supabase/tests/local_harness.sql
            for f in supabase/migrations/0*.sql; do
              psql -v ON_ERROR_STOP=1 -f "$f"
            done
            npm run test:planning-allocation --workspace @lumin/action-api
          done
      - name: Verify explicit installation owner operations and races in both crypto layouts
        timeout-minutes: 10
        env:
          LOCAL_HARNESS: "1"
          FLOW_TEST_DISPOSABLE: "1"
          MODE_INSTALLATIONS_TEST_DISPOSABLE: "1"
        run: |
          for layout in public extensions; do
            export PGDATABASE="lumin_installation_s1_${layout}"
            export MODE_INSTALLATIONS_CRYPTO_LAYOUT="$layout"
            psql -v ON_ERROR_STOP=1 -d postgres -c "create database ${PGDATABASE};"
            if [ "$layout" = extensions ]; then
              psql -v ON_ERROR_STOP=1 -c 'create schema extensions; create extension pgcrypto with schema extensions;'
            else
              psql -v ON_ERROR_STOP=1 -c 'create extension pgcrypto with schema public;'
            fi
            psql -v ON_ERROR_STOP=1 -f supabase/tests/local_harness.sql
            for f in supabase/migrations/0*.sql; do
              psql -v ON_ERROR_STOP=1 -f "$f"
            done
            psql -v ON_ERROR_STOP=1 -f supabase/tests/mode_installations_tests.sql
            npm run test:mode-installations --workspace @lumin/action-api
          done
      - name: Verify installation transport outcomes with actual PostgreSQL in both crypto layouts
        timeout-minutes: 10
        env:
          LOCAL_HARNESS: "1"
          FLOW_TEST_DISPOSABLE: "1"
          MODE_INSTALLATIONS_TEST_DISPOSABLE: "1"
        run: |
          for layout in public extensions; do
            export PGDATABASE="lumin_installation_s1_transport_${layout}"
            export MODE_INSTALLATIONS_CRYPTO_LAYOUT="$layout"
            psql -v ON_ERROR_STOP=1 -d postgres -c "create database ${PGDATABASE};"
            if [ "$layout" = extensions ]; then
              psql -v ON_ERROR_STOP=1 -c 'create schema extensions; create extension pgcrypto with schema extensions;'
            else
              psql -v ON_ERROR_STOP=1 -c 'create extension pgcrypto with schema public;'
            fi
            psql -v ON_ERROR_STOP=1 -f supabase/tests/local_harness.sql
            for f in supabase/migrations/0*.sql; do
              psql -v ON_ERROR_STOP=1 -f "$f"
            done
            npm run test:mode-installation-transport --workspace @lumin/action-api
          done

      - name: Verify mode session issuance requests and races in both crypto layouts
        timeout-minutes: 10
        env:
          LOCAL_HARNESS: '1'
          FLOW_TEST_DISPOSABLE: '1'
          MODE_SESSIONS_TEST_DISPOSABLE: '1'
        run: |
          for layout in public extensions; do
            export PGDATABASE="lumin_mode_session_${layout}"
            export MODE_SESSIONS_CRYPTO_LAYOUT="$layout"
            createdb "$PGDATABASE"
            if [ "$layout" = extensions ]; then
              psql -v ON_ERROR_STOP=1 -c 'create schema extensions; create extension pgcrypto with schema extensions;'
            else
              psql -v ON_ERROR_STOP=1 -c 'create extension pgcrypto with schema public;'
            fi
            psql -v ON_ERROR_STOP=1 -f supabase/tests/local_harness.sql
            for f in supabase/migrations/0*.sql; do psql -v ON_ERROR_STOP=1 -f "$f"; done
            psql -v ON_ERROR_STOP=1 -f supabase/tests/mode_flow_session_tests.sql
            npm run test:mode-flow-session --workspace @lumin/action-api
          done
      - name: Verify pinned session transport outcomes with actual PostgreSQL in both crypto layouts
        timeout-minutes: 10
        env:
          LOCAL_HARNESS: '1'
          FLOW_TEST_DISPOSABLE: '1'
          MODE_SESSIONS_TEST_DISPOSABLE: '1'
        run: |
          set -euo pipefail
          for layout in public extensions; do
            export PGDATABASE="lumin_mode_session_transport_${layout}"
            export MODE_SESSION_TRANSPORT_CRYPTO_LAYOUT="$layout"
            createdb "$PGDATABASE"
            if [ "$layout" = extensions ]; then
              psql -v ON_ERROR_STOP=1 -c 'create schema extensions; create extension pgcrypto with schema extensions;'
            else
              psql -v ON_ERROR_STOP=1 -c 'create extension pgcrypto with schema public;'
            fi
            psql -v ON_ERROR_STOP=1 -f supabase/tests/local_harness.sql
            for f in supabase/migrations/0*.sql; do psql -v ON_ERROR_STOP=1 -f "$f"; done
            npm run test:mode-session-transport --workspace @lumin/action-api
          done

      - name: Verify local owner HTTP isolation and persistence in both crypto layouts
        timeout-minutes: 10
        env:
          LOCAL_HARNESS: '1'
          FLOW_TEST_DISPOSABLE: '1'
          MODE_INSTALLATIONS_TEST_DISPOSABLE: '1'
          MODE_SESSIONS_TEST_DISPOSABLE: '1'
          MODE_OWNER_TEST_DISPOSABLE: '1'
          MODE_OWNER_API_PORT: '45131'
          MODE_OWNER_DRAFT_PORT: '45132'
          MODE_OWNER_PORTAL_PORT: '45133'
        run: |
          set -euo pipefail
          for layout in public extensions; do
            export PGDATABASE="lumin_mode_owner_journey_http_${layout}"
            export MODE_OWNER_CRYPTO_LAYOUT="$layout"
            createdb "$PGDATABASE"
            if [ "$layout" = extensions ]; then
              psql -v ON_ERROR_STOP=1 -c 'create schema extensions; create extension pgcrypto with schema extensions;'
            else
              psql -v ON_ERROR_STOP=1 -c 'create extension pgcrypto with schema public;'
            fi
            psql -v ON_ERROR_STOP=1 -f supabase/tests/local_harness.sql
            for f in supabase/migrations/0*.sql; do psql -v ON_ERROR_STOP=1 -f "$f"; done
            npm run test:mode-owner-journey --workspace @lumin/action-api
          done
      - name: Install pinned local owner browser runtime
        timeout-minutes: 5
        run: node scripts/install-mode-owner-browser.mjs
      - name: Verify actual owner Portal journeys in both crypto layouts
        timeout-minutes: 25
        env:
          LOCAL_HARNESS: '1'
          FLOW_TEST_DISPOSABLE: '1'
          MODE_INSTALLATIONS_TEST_DISPOSABLE: '1'
          MODE_SESSIONS_TEST_DISPOSABLE: '1'
          MODE_OWNER_TEST_DISPOSABLE: '1'
          MODE_OWNER_API_PORT: '45131'
          MODE_OWNER_DRAFT_PORT: '45132'
          MODE_OWNER_PORTAL_PORT: '45133'
          VITE_MODE_OWNER_LOCAL_HARNESS: 'true'
          VITE_MODE_OWNER_API_URL: 'http://127.0.0.1:45131'
          VITE_MODE_OWNER_DRAFT_API_URL: 'http://127.0.0.1:45132'
          VITE_FLOW_LOCAL_HARNESS: 'false'
          VITE_FLOW_API_URL: ''
          VITE_RUNTIME_MODE: 'mock'
          VITE_BASE_PATH: '/'
        run: |
          set -euo pipefail
          npm run build --workspace @lumin/portal
          mkdir -p .cache
          for layout in public extensions; do
            export PGDATABASE="lumin_mode_owner_journey_browser_${layout}"
            export MODE_OWNER_CRYPTO_LAYOUT="$layout"
            createdb "$PGDATABASE"
            if [ "$layout" = extensions ]; then
              psql -v ON_ERROR_STOP=1 -c 'create schema extensions; create extension pgcrypto with schema extensions;'
            else
              psql -v ON_ERROR_STOP=1 -c 'create extension pgcrypto with schema public;'
            fi
            psql -v ON_ERROR_STOP=1 -f supabase/tests/local_harness.sql
            for f in supabase/migrations/0*.sql; do psql -v ON_ERROR_STOP=1 -f "$f"; done
            node scripts/run-mode-owner-browser.mjs > ".cache/mode-owner-browser-${layout}.json"
          done
      - name: Validate explicit owner evidence file list
        id: owner_evidence
        if: always()
        run: node scripts/collect-mode-owner-artifacts.mjs
      - name: Retain reviewed owner screenshots and fixed summary
        if: always() && steps.owner_evidence.outputs.files != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, official ref verified
        with:
          name: local-owner-reviewed-evidence
          path: ${{ steps.owner_evidence.outputs.files }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  document:
    name: document (public policy + HTTPS + browser)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      LOCAL_HARNESS: '1'
      FLOW_TEST_DISPOSABLE: '1'
      MODE_INSTALLATIONS_TEST_DISPOSABLE: '1'
      MODE_DOCUMENT_TEST_DISPOSABLE: '1'
      MODE_DOCUMENT_API_PORT: '45231'
      MODE_DOCUMENT_RENDERER_PORT: '45232'
      MODE_DOCUMENT_PORTAL_PORT: '45233'
      MODE_DOCUMENT_MERCHANT_PORT: '45234'
      MODE_DOCUMENT_SECOND_PORT: '45235'
      MODE_DOCUMENT_FORBIDDEN_PORT: '45236'
      MODE_DOCUMENT_UNTRUSTED_PORT: '45237'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Record local test runtime versions
        run: node --version && npm --version && psql --version && /usr/bin/openssl version
      - name: Typecheck document HTTP and browser fixtures
        run: node node_modules/typescript/bin/tsc --noEmit --target ES2022 --module ESNext --moduleResolution bundler --jsx react-jsx --strict --esModuleInterop --skipLibCheck tests/mode-document/fixtures.ts tests/mode-document/document.integration.ts tests/mode-document/browser-fixtures.ts tests/mode-document/document.spec.ts tests/mode-document/safe-reporter.ts playwright.mode-document.config.ts
      - name: Verify actual policy HTTP and TLS in both crypto layouts
        timeout-minutes: 12
        run: |
          set -euo pipefail
          for layout in public extensions; do
            export PGDATABASE="lumin_mode_document_http_${layout}"
            export MODE_DOCUMENT_CRYPTO_LAYOUT="$layout"
            createdb "$PGDATABASE"
            if [ "$layout" = extensions ]; then
              psql -v ON_ERROR_STOP=1 -c 'create schema extensions; create extension pgcrypto with schema extensions;'
            else
              psql -v ON_ERROR_STOP=1 -c 'create extension pgcrypto with schema public;'
            fi
            psql -v ON_ERROR_STOP=1 -f supabase/tests/local_harness.sql
            for f in supabase/migrations/0*.sql; do psql -v ON_ERROR_STOP=1 -f "$f"; done
            node scripts/run-mode-document-http.mjs
          done
      - name: Install accepted pinned browser runtime
        timeout-minutes: 5
        run: node scripts/install-mode-owner-browser.mjs
      - name: Verify actual document browser journeys in both crypto layouts
        timeout-minutes: 23
        run: |
          set -euo pipefail
          mkdir -p .cache
          for layout in public extensions; do
            export PGDATABASE="lumin_mode_document_browser_${layout}"
            export MODE_DOCUMENT_CRYPTO_LAYOUT="$layout"
            createdb "$PGDATABASE"
            if [ "$layout" = extensions ]; then
              psql -v ON_ERROR_STOP=1 -c 'create schema extensions; create extension pgcrypto with schema extensions;'
            else
              psql -v ON_ERROR_STOP=1 -c 'create extension pgcrypto with schema public;'
            fi
            psql -v ON_ERROR_STOP=1 -f supabase/tests/local_harness.sql
            for f in supabase/migrations/0*.sql; do psql -v ON_ERROR_STOP=1 -f "$f"; done
            node scripts/run-mode-document-browser.mjs > ".cache/mode-document-browser-${layout}.json"
          done
      - name: Validate explicit document evidence file list
        id: document_evidence
        if: always()
        run: node scripts/collect-mode-document-artifacts.mjs
      - name: Retain reviewed document screenshots and fixed summaries
        if: always() && steps.document_evidence.outputs.files != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, accepted pinned action
        with:
          name: local-document-reviewed-evidence
          path: ${{ steps.document_evidence.outputs.files }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
