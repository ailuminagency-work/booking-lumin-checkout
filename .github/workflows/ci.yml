name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: verify (typecheck, test, build, contamination)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: bash scripts/contamination-check.sh

  database:
    name: database (migrations + RLS attack suite)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: lumin_test
    steps:
      - uses: actions/checkout@v4
      - name: Create test database
        run: psql -h localhost -U postgres -d postgres -c 'create database lumin_test;'
      - name: Apply local harness
        run: psql -v ON_ERROR_STOP=1 -d lumin_test -f supabase/tests/local_harness.sql
      - name: Apply all active migrations 0001..0030 in order (excluding _deferred)
        run: |
          for f in supabase/migrations/0*.sql; do
            echo "applying $f"
            psql -v ON_ERROR_STOP=1 -d lumin_test -f "$f"
          done
      - name: Run RLS attack suite (fails on any FAIL)
        run: psql -v ON_ERROR_STOP=1 -d lumin_test -f supabase/tests/rls_attack_tests.sql
      - name: Run domain security suites (each transactional; fails on any FAIL)
        run: |
          for s in \
            platform_financial_minimization_tests \
            capacity_tests \
            resource_rls_tests \
            resource_tenant_integrity_tests \
            resource_quantity_tests \
            worker_roster_tests \
            owner_roster_snapshot_tests \
            planning_policy_tests \
            carrier_direct_write_tests \
            group_lifecycle_tests \
            group_financial_boundary_tests \
            planning_allocator_tests \
            crypto_extension_binding_tests \
            bound_flow_tests \
            configurable_flow_tests \
            flow_storage_tests \
            outbox_tests \
            mode_installations_tests \
            mode_flow_session_tests; do
            echo "running $s"
            psql -v ON_ERROR_STOP=1 -d lumin_test -f "supabase/tests/${s}.sql"
          done
