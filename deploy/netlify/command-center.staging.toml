[build]
  base = "apps/command-center"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_RUNTIME_MODE = "supabase"
  VITE_SUPABASE_URL = "__SET_STAGING_SUPABASE_URL__"
  VITE_SUPABASE_PUBLISHABLE_KEY = "__SET_STAGING_SUPABASE_PUBLISHABLE_KEY__"
  VITE_TENANT_ID = "__PLATFORM_CONTEXT_ONLY__"

[context.deploy-preview]
  command = "npm run build"
