[build]
  command = "npm run build --workspace @lumin/checkout"
  publish = "apps/checkout/dist"

[build.environment]
  NODE_VERSION = "20"
  # The API endpoint is the isolated Booking Lumin Render staging service.
  # Public auth configuration belongs to the isolated staging site environment.
  # Customer installation sessions derive tenant identity on the server.
  VITE_RUNTIME_ENV = "staging"
  VITE_RUNTIME_MODE = "supabase"
  VITE_API_ORIGIN = "https://booking-lumin-api-staging.onrender.com"
  VITE_FLOW_API_URL = "https://booking-lumin-api-staging.onrender.com"

[context.deploy-preview]
  command = "npm run build --workspace @lumin/checkout"
